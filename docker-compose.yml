version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api-accounts
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    environment:
      # Required

      # Application Configuration
      - PORT=${PORT:-8080}
      - GIN_MODE=${GIN_MODE:-release}

      # Optional - API Base URLs (uses defaults if not set)
      
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:${PORT:-8080}/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - app-network

networks:
  app-network:
    driver: bridge